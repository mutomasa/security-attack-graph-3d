name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.23
        env:
          NEO4J_AUTH: neo4j/attackgraph
        ports:
          - 17687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p attackgraph 'RETURN 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q
