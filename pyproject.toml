[project]
name = "security-attack-graph-3d"
version = "0.1.0"
description = "Attack path knowledge graph demo: Neo4j + Qwen + Three.js + Streamlit"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=6.4.1",
    "networkx>=3.6.1",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "neo4j: requires a running Neo4j instance (NEO4J_URI)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
